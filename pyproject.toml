[project]
name = "stv2"
version = "0.1.0"
description = "Single tank groundwater model"
authors = [
    {name = "rekin226"}
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyshp>=2.3",
    "numba>=0.58",
    "tqdm>=4.65",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
